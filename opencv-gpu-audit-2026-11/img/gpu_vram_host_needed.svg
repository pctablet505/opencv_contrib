<text class="muted tiny" x="242" y="514" text-anchor="end">S = 4096, pure-CUDA forward()</text>
<line class="gap" x1="279.3" y1="502.0" x2="305.3" y2="502.0" stroke-width="8" stroke-linecap="round"/>
<circle class="need" cx="279.3" cy="502.0" r="5.8" stroke-width="1.8"/>
<circle class="now" cx="305.3" cy="502.0" r="5.8" stroke-width="1.8"/>
