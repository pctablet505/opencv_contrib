<text class="muted tiny" x="242" y="214" text-anchor="end">8 blocks, 2048 × 768 ↔ 3072</text>
<line class="gap" x1="327.0" y1="202.0" x2="414.6" y2="202.0" stroke-width="8" stroke-linecap="round"/>
