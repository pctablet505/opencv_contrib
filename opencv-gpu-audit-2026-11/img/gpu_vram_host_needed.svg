<text class="muted tiny" x="548.2" y="322" text-anchor="middle">800</text>
<text class="ink2 small" x="424" y="340" text-anchor="middle">GPU VRAM (MiB)</text>
<text class="mono ink" x="242" y="86" text-anchor="end">AttentionOp (FP16 vs stock FP32)</text>
<text class="muted tiny" x="242" y="100" text-anchor="end">S = 4096, 12 heads, D = 768</text>
<line class="gap" x1="286.6" y1="88.0" x2="581.4" y2="88.0" stroke-width="8" stroke-linecap="round"/>
