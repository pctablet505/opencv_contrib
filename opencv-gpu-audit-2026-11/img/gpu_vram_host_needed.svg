<rect class="sw-gap" x="458" y="45" width="18" height="6" rx="3"/>
<text class="ink2 small" x="482" y="52">avoidable waste</text>
<line class="grid" x1="256.0" y1="68" x2="256.0" y2="306" stroke-width="1"/>
<text class="muted tiny" x="256.0" y="322" text-anchor="middle">0</text>
