<text class="now-t small b" x="838" y="506" text-anchor="end">−47.9 MiB (53%)</text>
<text class="mono ink" x="242" y="538" text-anchor="end">CUDA_FP16 steady forward()</text>
<text class="muted tiny" x="242" y="552" text-anchor="end">1080p [1,3,1080,1920] heap churn/call</text>
<line class="gap" x1="256.0" y1="540.0" x2="281.7" y2="540.0" stroke-width="8" stroke-linecap="round"/>
