<text class="now-t small b" x="838" y="130" text-anchor="end">−365.6 MiB (81%)</text>
<text class="mono ink" x="242" y="162" text-anchor="end">AttentionOp (FP32 exact)</text>
<text class="muted tiny" x="242" y="176" text-anchor="end">S = 4096, 12 heads, D = 768</text>
<line class="gap" x1="314.3" y1="164.0" x2="581.4" y2="164.0" stroke-width="8" stroke-linecap="round"/>
