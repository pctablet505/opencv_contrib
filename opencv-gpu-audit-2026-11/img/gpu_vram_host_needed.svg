<text class="now-t small b" x="838" y="244" text-anchor="end">−173.2 MiB (66%)</text>
<text class="mono ink" x="242" y="276" text-anchor="end">CudaUMatAllocator::allocate</text>
<text class="muted tiny" x="242" y="290" text-anchor="end">retained leak per 4 MiB buffer</text>
<line class="gap" x1="256.0" y1="278.0" x2="257.5" y2="278.0" stroke-width="8" stroke-linecap="round"/>
<circle class="need" cx="256.0" cy="278.0" r="5.8" stroke-width="1.8"/>
<circle class="now" cx="257.5" cy="278.0" r="5.8" stroke-width="1.8"/>
