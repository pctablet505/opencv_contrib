<text class="muted tiny" x="242" y="252" text-anchor="end">S = 2048, 12 heads, D = 768</text>
<line class="gap" x1="288.0" y1="240.0" x2="351.3" y2="240.0" stroke-width="8" stroke-linecap="round"/>
<circle class="need" cx="288.0" cy="240.0" r="5.8" stroke-width="1.8"/>
<circle class="now" cx="351.3" cy="240.0" r="5.8" stroke-width="1.8"/>
