<text class="muted tiny" x="242" y="476" text-anchor="end">4 blocks, shadow host pool + packB</text>
<line class="gap" x1="267.0" y1="464.0" x2="356.6" y2="464.0" stroke-width="8" stroke-linecap="round"/>
