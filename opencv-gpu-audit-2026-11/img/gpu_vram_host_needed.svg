<text class="muted tiny" x="472.8" y="622" text-anchor="middle">400</text>
<line class="grid" x1="527.0" y1="406" x2="527.0" y2="606" stroke-width="1"/>
<text class="muted tiny" x="527.0" y="622" text-anchor="middle">500</text>
<line class="grid" x1="581.2" y1="406" x2="581.2" y2="606" stroke-width="1"/>
<text class="muted tiny" x="581.2" y="622" text-anchor="middle">600</text>
<text class="ink2 small" x="424" y="642" text-anchor="middle">Host RAM / PCIe transfer (MiB)</text>
<text class="mono ink" x="242" y="424" text-anchor="end">MatMul + 1-D bias (host held)</text>
<text class="muted tiny" x="242" y="438" text-anchor="end">8 blocks, broadcast_bias + MLAS pack</text>
<line class="gap" x1="344.2" y1="426.0" x2="579.8" y2="426.0" stroke-width="8" stroke-linecap="round"/>
<circle class="need" cx="344.2" cy="426.0" r="5.8" stroke-width="1.8"/>
<circle class="now" cx="579.8" cy="426.0" r="5.8" stroke-width="1.8"/>
