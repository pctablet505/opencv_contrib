<rect class="bg" x="0.5" y="0.5" width="859" height="243" rx="8"/>
<text class="ink title" x="22" y="28">dnn::Net::setParam() on CUDA (5.x): captured cudaGraphExec &amp; backendNodes replay old weights</text>
<text class="ink2 sub" x="22" y="47">Gemm weight initialized to W = 2·I, updated via net.setParam(id, 0, 5·I) before Call #3 (input X = [1, 1, 1, 1])</text>
<rect class="card" x="22" y="66" width="158" height="114" rx="6"/>
<text class="ink b" x="34" y="88">Call #1 (W = 2·I)</text>
<text class="muted small" x="34" y="107">Eager execution</text>
<text class="muted small" x="34" y="124">Uploads 2·I to VRAM</text>
<rect class="pill-ok" x="34" y="144" width="134" height="24" rx="4"/>
<text class="mono ink small b" x="101" y="160" text-anchor="middle">output = 2.00</text>
<line class="axis" x1="184" y1="123" x2="202" y2="123" stroke-width="1.8"/>
<polygon fill="#8c959f" points="206,123 198,118.5 198,127.5"/>
<rect class="card" x="210" y="66" width="176" height="114" rx="6"/>
<text class="ink b" x="222" y="88">Call #2 (W = 2·I)</text>
<text class="muted small" x="222" y="107">Records cudaGraphExec</text>
<text class="muted small" x="222" y="124">with 2·I device ptr</text>
<rect class="pill-ok" x="222" y="144" width="152" height="24" rx="4"/>
<text class="mono ink small b" x="298" y="160" text-anchor="middle">output = 2.00</text>
<line class="axis" x1="390" y1="123" x2="408" y2="123" stroke-width="1.8"/>
<polygon fill="#8c959f" points="412,123 404,118.5 404,127.5"/>
<rect class="card-warn" x="416" y="66" width="176" height="114" rx="6"/>
<text class="ink b" x="428" y="88">setParam(5·I)</text>
<text class="muted small" x="428" y="107">Bumps weightEpoch</text>
<text class="now-t small b" x="428" y="126">Keeps stale graph</text>
<text class="now-t small" x="428" y="143">&amp; backendNodes</text>
<text class="mono muted tiny" x="428" y="165">expected = 5.00</text>
<line class="axis" x1="596" y1="123" x2="614" y2="123" stroke-width="1.8"/>
<polygon fill="#8c959f" points="618,123 610,118.5 610,127.5"/>
<rect class="card-bad" x="622" y="66" width="216" height="53" rx="6"/>
<text class="now-t small b" x="634" y="86">Stock 5.x — Call #3</text>
<text class="mono now-t small b" x="634" y="107">output = 2.00 (stale 2·I!)</text>
<rect class="card-ok" x="622" y="127" width="216" height="53" rx="6"/>
<text class="need-t small b" x="634" y="147">PR #30929 — Call #3</text>
<text class="mono need-t small b" x="634" y="168">output = 5.00 (expected)</text>
<text class="ink2 small" x="22" y="206"><tspan class="b">Pre-capture case:</tspan> calling <tspan class="mono">setParam()</tspan> between Call #1 &amp; Call #2 triggers <tspan class="mono">cudaMalloc</tspan> inside stream capture and aborts with</text>
<text class="ink2 small" x="22" y="225"><tspan class="mono now-t">cudaErrorStreamCaptureUnsupported</tspan>. PR #30929 resets <tspan class="mono">cudaGraphExec</tspan>, clears <tspan class="mono">backendNodes</tspan>, and re-packs before capture.</text>
</svg>
