<rect class="bg" x="0.5" y="0.5" width="859" height="267" rx="8"/>
<text class="ink title" x="22" y="28">CUDA normalization (mvn.cu): uncentered E[X²] − E[X]² &lt; 0 returns 100% NaN</text>
<text class="ink2 sub" x="22" y="47">Input x = 10,000.3 + 10⁻³·δ  ([8 × 768] = 6,144 elements, eps = 1e−5) across MVN, LayerNorm, InstanceNorm &amp; GroupNorm</text>
<line class="grid" x1="285.0" y1="64" x2="285.0" y2="222" stroke-width="1"/>
<text class="muted tiny" x="285.0" y="238" text-anchor="middle">-3.0</text>
<line class="grid" x1="375.0" y1="64" x2="375.0" y2="222" stroke-width="1"/>
<text class="muted tiny" x="375.0" y="238" text-anchor="middle">-2.0</text>
<line class="grid" x1="465.0" y1="64" x2="465.0" y2="222" stroke-width="1"/>
<text class="muted tiny" x="465.0" y="238" text-anchor="middle">-1.0</text>
<line class="grid" x1="555.0" y1="64" x2="555.0" y2="222" stroke-width="1"/>
<text class="muted tiny" x="555.0" y="238" text-anchor="middle">0.0</text>
<text class="muted small" x="420" y="255" text-anchor="middle">Output sample Y[0, 0] value (dashed line = FP64 exact -1.3557)</text>
<line class="need-s" x1="433.0" y1="62" x2="433.0" y2="224" stroke-width="1.3" stroke-dasharray="4,3"/>
<text class="ink b" x="268" y="82" text-anchor="end">FP64 exact reference</text>
<text class="muted small" x="268" y="97" text-anchor="end">double-precision mean &amp; variance</text>
<line class="stem-gray" x1="433.0" y1="86.0" x2="555.0" y2="86.0" stroke-width="9" stroke-linecap="round"/>
<circle class="neutral" cx="433.0" cy="86.0" r="6" stroke-width="2"/>
<text class="mono ink small" x="574" y="90.0" text-anchor="start">Y[0,0] = -1.3557</text>
<text class="ink2 small" x="838" y="90.0" text-anchor="end">0 / 6,144 NaN (exact)</text>
<text class="ink b" x="268" y="121" text-anchor="end">Stock CPU (fastNorm)</text>
<text class="muted small" x="268" y="136" text-anchor="end">clamps negative E[X²]−E[X]² to 0</text>
<line class="gap" x1="304.9" y1="125.0" x2="555.0" y2="125.0" stroke-width="9" stroke-linecap="round"/>
<circle class="coral" cx="304.9" cy="125.0" r="6" stroke-width="2"/>
<text class="mono ink small" x="574" y="129.0" text-anchor="start">Y[0,0] = -2.7793</text>
<text class="coral-t b small" x="838" y="129.0" text-anchor="end">max |err| = 1.424</text>
<text class="ink b" x="268" y="160" text-anchor="end">Stock CUDA (4.x &amp; 5.x)</text>
<text class="muted small" x="268" y="175" text-anchor="end">rsqrt(eps + var) with var &lt; −eps</text>
<rect class="pill-bad" x="285" y="153.0" width="270" height="22" rx="4"/>
<text class="mono now-t tiny b" x="420" y="167.5" text-anchor="middle">rsqrt(eps + var) → all 6,144 outputs NaN</text>
<text class="mono ink small" x="574" y="168.0" text-anchor="start">Y[0,0] = NaN</text>
<text class="now-t b small" x="838" y="168.0" text-anchor="end">6,144 / 6,144 NaN (100%)</text>
<text class="ink b" x="268" y="199" text-anchor="end">Centered 2-pass CUDA</text>
<text class="muted small" x="268" y="214" text-anchor="end">E[(X − μ)²] ≥ 0 (#30926 / #30927)</text>
<line class="stem-blue" x1="432.6" y1="203.0" x2="555.0" y2="203.0" stroke-width="9" stroke-linecap="round"/>
<circle class="need" cx="432.6" cy="203.0" r="6" stroke-width="2"/>
<text class="mono ink small" x="574" y="207.0" text-anchor="start">Y[0,0] = -1.3603</text>
<text class="need-t b small" x="838" y="207.0" text-anchor="end">0 NaN · |err| = 0.0047</text>
</svg>
