<svg xmlns="http://www.w3.org/2000/svg" width="860" height="256" viewBox="0 0 860 256" role="img">
<title>Square Gemm(transB=0) mutates blobs[0] in place across input shape changes</title>
<style>
  .bg{fill:#fcfcfb;stroke:#e1e0d9}
  .card{fill:#f6f5f2;stroke:#e1e0d9}
  .card-ok{fill:#eef6ff;stroke:#b6d5fa}
  .card-bad{fill:#fdf2f2;stroke:#f1b8b5}
  .card-warn{fill:#fef8ec;stroke:#ebd099}
  .ink{fill:#1f2328}
  .ink2{fill:#57606a}
  .muted{fill:#7d8590}
  .grid{stroke:#eaeef2}
  .axis{stroke:#d0d7de}
  .need{fill:#2a78d6;stroke:#fcfcfb}
  .need-s{stroke:#2a78d6}
  .need-t{fill:#1b5fb8}
  .teal{fill:#0e8a72;stroke:#fcfcfb}
  .teal-s{stroke:#0e8a72}
  .teal-t{fill:#0b6e5b}
  .now{fill:#cf3a3a;stroke:#fcfcfb}
  .now-s{stroke:#cf3a3a}
  .now-t{fill:#b42318}
  .coral{fill:#e07a74;stroke:#fcfcfb}
  .coral-s{stroke:#e07a74}
  .coral-t{fill:#b84a44}
  .neutral{fill:#57606a;stroke:#fcfcfb}
  .neutral-s{stroke:#6e7781}
  .gap{stroke:#f4c0bd}
  .stem-blue{stroke:#a8ccf7}
  .stem-teal{stroke:#99dcd0}
  .stem-gray{stroke:#d0d7de}
  .null-band{fill:#eaeef2;fill-opacity:0.7}
  .null-pt{fill:#8c959f;stroke:#fcfcfb}
  .ci{stroke:#1f2328}
  .sw-need{fill:#2a78d6}
  .sw-now{fill:#cf3a3a}
  .sw-gap{fill:#f4c0bd}
  .sw-teal{fill:#0e8a72}
  .sw-null{fill:#8c959f}
  .pill-bad{fill:#fbe9e8;stroke:#e8a19d}
  .pill-ok{fill:#e8f3ff;stroke:#9ec5f8}
  .pill-warn{fill:#fff4db;stroke:#e3be74}
  @media (prefers-color-scheme: dark){
    .bg{fill:#151b23;stroke:#30363d}
    .card{fill:#1c232d;stroke:#30363d}
    .card-ok{fill:#16263b;stroke:#2b5387}
    .card-bad{fill:#2d191b;stroke:#6e2c2e}
    .card-warn{fill:#2b2314;stroke:#634d20}
    .ink{fill:#e6edf3}
    .ink2{fill:#9198a1}
    .muted{fill:#7d8590}
    .grid{stroke:#262c36}
    .axis{stroke:#3d444d}
    .need{fill:#4493f8;stroke:#151b23}
    .need-s{stroke:#4493f8}
    .need-t{fill:#6cb0ff}
    .teal{fill:#26b397;stroke:#151b23}
    .teal-s{stroke:#26b397}
    .teal-t{fill:#4cd4b8}
    .now{fill:#f05d5d;stroke:#151b23}
    .now-s{stroke:#f05d5d}
    .now-t{fill:#ff8a80}
    .coral{fill:#f29b96;stroke:#151b23}
    .coral-s{stroke:#f29b96}
    .coral-t{fill:#ffb3ae}
    .neutral{fill:#9198a1;stroke:#151b23}
    .neutral-s{stroke:#9198a1}
    .gap{stroke:#5c2a2a}
    .stem-blue{stroke:#244875}
    .stem-teal{stroke:#194f45}
    .stem-gray{stroke:#363e48}
    .null-band{fill:#262c36;fill-opacity:0.8}
    .null-pt{fill:#9198a1;stroke:#151b23}
    .ci{stroke:#e6edf3}
    .sw-need{fill:#4493f8}
    .sw-now{fill:#f05d5d}
    .sw-gap{fill:#5c2a2a}
    .sw-teal{fill:#26b397}
    .sw-null{fill:#9198a1}
    .pill-bad{fill:#3b1d1f;stroke:#823638}
    .pill-ok{fill:#182b45;stroke:#315f9c}
    .pill-warn{fill:#362b16;stroke:#755a24}
  }
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:13px}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-size:12.2px}
  .small{font-size:11.5px}
  .tiny{font-size:10.8px}
  .b{font-weight:600}
  .title{font-size:14.5px;font-weight:600}
  .sub{font-size:12px}
</style>
<rect class="bg" x="0.5" y="0.5" width="859" height="255" rx="8"/>
<text class="ink title" x="22" y="28">Square Gemm(transB = 0, K = N): cv::transpose(B, B) mutates blobs[0] in place</text>
<text class="ink2 sub" x="22" y="47">InnerProductOp always computes X · Bᵀ, so initCUDA() transposes B once — except square cv::transpose(B, B) overwrites blobs[0]</text>
<rect class="card" x="22" y="64" width="186" height="128" rx="6"/>
<text class="ink b" x="36" y="86">1. Loaded weight</text>
<text class="mono ink2 small" x="36" y="106">blobs[0] = W  [4 × 4]</text>
<text class="ink2 small" x="36" y="128">Upper-triangular W</text>
<text class="ink2 small" x="36" y="146">(W ≠ Wᵀ, transB = 0)</text>
<rect class="pill-ok" x="36" y="160" width="156" height="22" rx="4"/>
<text class="mono need-t small b" x="114" y="175" text-anchor="middle">blobs[0] holds W</text>
<line class="axis" x1="214" y1="128" x2="242" y2="128" stroke-width="1.8"/>
<polygon fill="#8c959f" points="246,128 238,123.5 238,132.5"/>
<rect class="card-warn" x="252" y="64" width="262" height="128" rx="6"/>
<text class="ink b" x="266" y="86">2. Call #1 (batch = 1): initCUDA()</text>
<text class="mono ink small" x="266" y="106">Mat B = blobs[0]; transpose(B, B);</text>
<text class="ink2 small" x="266" y="127">K == N → aliases &amp; mutates blobs[0] → Wᵀ</text>
<text class="ink2 small" x="266" y="145">GPU computes X₁ · (Wᵀ)ᵀ = X₁ · W</text>
<rect class="pill-warn" x="264" y="160" width="238" height="22" rx="4"/>
<text class="mono ink tiny b" x="383" y="175" text-anchor="middle">max|Y − X·W| = 0.00 (hidden on #1)</text>
<line class="axis" x1="520" y1="128" x2="548" y2="128" stroke-width="1.8"/>
<polygon fill="#8c959f" points="552,128 544,123.5 544,132.5"/>
<rect class="card-bad" x="558" y="64" width="280" height="128" rx="6"/>
<text class="now-t b" x="572" y="86">3. Call #2 (batch = 2): re-runs initCUDA()</text>
<text class="mono ink small" x="572" y="106">transpose(B, B) flips Wᵀ back to W</text>
<text class="ink2 small" x="572" y="127">GPU now computes X₂ · (W)ᵀ = X₂ · Wᵀ!</text>
<text class="mono ink2 small" x="572" y="145">max|Y − X·Wᵀ| = 0.00 (exact wrong op)</text>
<rect class="pill-bad" x="570" y="160" width="256" height="22" rx="4"/>
<text class="mono now-t tiny b" x="698" y="175" text-anchor="middle">max|Y − X·W| = 9.75 (silent wrong!)</text>
<rect class="card-ok" x="22" y="206" width="816" height="34" rx="6"/>
<circle class="sw-need" cx="40" cy="223" r="5"/>
<text class="ink small" x="53" y="227"><tspan class="b">Fixed (#30923 / #30924):</tspan> non-aliasing <tspan class="mono">Mat Bt; transpose(blobs[0], Bt)</tspan> keeps <tspan class="mono need-t b">blobs[0] == W</tspan> · (<tspan class="mono need-t b">max|err| = 0.00</tspan> after reshape).</text>
</svg>
