<rect class="bg" x="0.5" y="0.5" width="859" height="273" rx="8"/>
<text class="ink title" x="22" y="28">core::CudaUMatAllocator (5.x): stale VRAM read, 100% buffer leak, and 2,160-call ROI copy</text>
<text class="ink2 sub" x="22" y="47">Measured in modules/core/src/cuda_umat.cpp on stock 5.x (80db42de85) vs PR #30928</text>
<text class="muted small b" x="22" y="72">Defect in cuda_umat.cpp</text>
<text class="muted small b" x="292" y="72">Stock 5.x (measured)</text>
<text class="muted small b" x="570" y="72">PR #30928 (measured)</text>
<line class="axis" x1="22" y1="80" x2="838" y2="80" stroke-width="1"/>
<text class="ink b" x="22" y="106">1. Host-wrapped UMat (data0)</text>
<text class="muted small" x="22" y="123">download() / copy() ignores</text>
<text class="mono muted tiny" x="22" y="138">deviceCopyObsolete() == true</text>
<rect class="card-bad" x="292" y="90" width="262" height="54" rx="6"/>
<text class="mono now-t b" x="306" y="112">downloaded = 0.0  (expected 42.5)</text>
<text class="ink2 small" x="306" y="131">reads uninitialized cudaMalloc buffer</text>
<rect class="card-ok" x="570" y="90" width="268" height="54" rx="6"/>
<text class="mono need-t b" x="584" y="112">downloaded = 42.5</text>
<text class="ink2 small" x="584" y="131">flushes u-&gt;data to device first</text>
<text class="ink b" x="22" y="172">2. allocate(UMatData*) leak</text>
<text class="muted small" x="22" y="189">leaves u-&gt;currAllocator unset;</text>
<text class="muted tiny" x="22" y="204">0-D allocate() writes step[-1]</text>
<rect class="card-bad" x="292" y="154" width="262" height="54" rx="6"/>
<text class="mono now-t b" x="306" y="176">+4.00 MiB leaked / 4.00 MiB</text>
<text class="ink2 small" x="306" y="195">deallocate() skips cudaFree(u-&gt;handle)</text>
<rect class="card-ok" x="570" y="154" width="268" height="54" rx="6"/>
<text class="mono need-t b" x="584" y="176">0.00 MiB leaked · 0-D safe</text>
<text class="ink2 small" x="584" y="195">sets u-&gt;currAllocator = this</text>
<text class="ink b" x="22" y="236">3. 2-D ROI copyPlanes()</text>
<text class="muted small" x="22" y="253">1920 × 1080 ROI copy</text>
<rect class="card-bad" x="292" y="218" width="262" height="44" rx="6"/>
<text class="mono now-t b" x="306" y="238">2,160 sync cudaMemcpy · 7.63 ms</text>
<text class="ink2 tiny" x="306" y="254">11.27 ms in 30-sample opencv_perf_core</text>
<rect class="card-ok" x="570" y="218" width="268" height="44" rx="6"/>
<text class="mono need-t b" x="584" y="238">1 cudaMemcpy2D · 0.46 ms (16.7×)</text>
<text class="ink2 tiny" x="584" y="254">0.74 ms in opencv_perf_core (15.2× faster)</text>
</svg>
