<svg xmlns="http://www.w3.org/2000/svg" width="640" height="288" viewBox="0 0 640 288" role="img">
<title>Memory held after each load and destroy cycle grows by 3.2 MB every time, from 3.2 MB after one load to 32.0 MB after ten.</title>
<style>.bg{fill:#ffffff;stroke:#d6dfdf}.track{fill:#e4eaea}.fill{fill:#c4772a}.lab{fill:#57686a}.v{fill:#15201f}@media (prefers-color-scheme: dark){.bg{fill:#151e1e;stroke:#2a3736}.track{fill:#223030}.fill{fill:#d98d3e}.lab{fill:#9aaba9}.v{fill:#e3ecea}}text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;font-size:13px}.v{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;font-size:12.5px}</style>
<rect class="bg" x="0.5" y="0.5" width="639" height="287" rx="6"/>
<text class="lab" x="118" y="31" text-anchor="end">1 load</text>
<rect class="track" x="126" y="20" width="420" height="14" rx="3"/>
<rect class="fill" x="126" y="20" width="42.0" height="14" rx="3"/>
<text class="v" x="556" y="31">3.2 MB</text>
<text class="lab" x="118" y="57" text-anchor="end">2</text>
<rect class="track" x="126" y="46" width="420" height="14" rx="3"/>
<rect class="fill" x="126" y="46" width="84.0" height="14" rx="3"/>
<text class="v" x="556" y="57">6.4 MB</text>
<text class="lab" x="118" y="83" text-anchor="end">3</text>
<rect class="track" x="126" y="72" width="420" height="14" rx="3"/>
<rect class="fill" x="126" y="72" width="126.0" height="14" rx="3"/>
<text class="v" x="556" y="83">9.6 MB</text>
<text class="lab" x="118" y="109" text-anchor="end">4</text>
<rect class="track" x="126" y="98" width="420" height="14" rx="3"/>
<rect class="fill" x="126" y="98" width="168.0" height="14" rx="3"/>
<text class="v" x="556" y="109">12.8 MB</text>
<text class="lab" x="118" y="135" text-anchor="end">5</text>
<rect class="track" x="126" y="124" width="420" height="14" rx="3"/>
<rect class="fill" x="126" y="124" width="210.0" height="14" rx="3"/>
<text class="v" x="556" y="135">16.0 MB</text>
<text class="lab" x="118" y="161" text-anchor="end">6</text>
<rect class="track" x="126" y="150" width="420" height="14" rx="3"/>
<rect class="fill" x="126" y="150" width="252.0" height="14" rx="3"/>
<text class="v" x="556" y="161">19.2 MB</text>
<text class="lab" x="118" y="187" text-anchor="end">7</text>
<rect class="track" x="126" y="176" width="420" height="14" rx="3"/>
<rect class="fill" x="126" y="176" width="294.0" height="14" rx="3"/>
<text class="v" x="556" y="187">22.4 MB</text>
<text class="lab" x="118" y="213" text-anchor="end">8</text>
<rect class="track" x="126" y="202" width="420" height="14" rx="3"/>
<rect class="fill" x="126" y="202" width="336.0" height="14" rx="3"/>
<text class="v" x="556" y="213">25.6 MB</text>
<text class="lab" x="118" y="239" text-anchor="end">9</text>
<rect class="track" x="126" y="228" width="420" height="14" rx="3"/>
<rect class="fill" x="126" y="228" width="378.0" height="14" rx="3"/>
<text class="v" x="556" y="239">28.8 MB</text>
<text class="lab" x="118" y="265" text-anchor="end">10 loads</text>
<rect class="track" x="126" y="254" width="420" height="14" rx="3"/>
<rect class="fill" x="126" y="254" width="420.0" height="14" rx="3"/>
<text class="v" x="556" y="265">32.0 MB</text>
</svg>
