<svg xmlns="http://www.w3.org/2000/svg" width="860" height="282" viewBox="0 0 860 282" role="img">
<title>Dense RLOF grid points with default parameters, by frame size, against the 32,767 limit</title><style>.bg{fill:#fcfcfb;stroke:#e1e0d9}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.muted{fill:#898781}.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.track{fill:#e1e0d9}.s1{fill:#2a78d6}.s1l{stroke:#2a78d6}.bad{fill:#d03b3b}.badl{stroke:#d03b3b}.badt{fill:#b42318}.ok{fill:#0ca30c}.okt{fill:#067a06}.ref{stroke:#898781}.zone{fill:#d03b3b;fill-opacity:0.08}.v5{fill:#6f42c1}.v5l{stroke:#6f42c1}.v5t{fill:#6f42c1}.cell{stroke:#c3c2b7;fill:#fcfcfb}.past{fill:#d03b3b;fill-opacity:0.10;stroke:#d03b3b}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19;stroke:#383835}.ink{fill:#f0efec}.ink2{fill:#c3c2b7}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.track{fill:#2c2c2a}.s1{fill:#3987e5}.s1l{stroke:#3987e5}.badt{fill:#f07f7f}.v5{fill:#a371f7}.v5l{stroke:#a371f7}.v5t{fill:#b893fa}.okt{fill:#3ccf3c}.zone{fill-opacity:0.16}.cell{stroke:#4a4a47;fill:#1a1a19}.past{fill-opacity:0.22}}text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;font-size:13px}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;font-size:12.5px}.small{font-size:11.5px}.b{font-weight:600}</style>
