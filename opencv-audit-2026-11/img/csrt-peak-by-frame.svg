<svg xmlns="http://www.w3.org/2000/svg" width="640" height="158" viewBox="0 0 640 158" role="img">
<title>Peak memory per CSRT update rises with the frame size, from 6.2 MiB at 480 by 360 to 110.8 MiB at 3840 by 2160.</title>
<style>.bg{fill:#ffffff;stroke:#d6dfdf}.track{fill:#e4eaea}.fill{fill:#c4772a}.lab{fill:#57686a}.v{fill:#15201f}@media (prefers-color-scheme: dark){.bg{fill:#151e1e;stroke:#2a3736}.track{fill:#223030}.fill{fill:#d98d3e}.lab{fill:#9aaba9}.v{fill:#e3ecea}}text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;font-size:13px}.v{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;font-size:12.5px}</style>
<rect class="bg" x="0.5" y="0.5" width="639" height="157" rx="6"/>
<text class="lab" x="118" y="31" text-anchor="end">480 × 360</text>
<rect class="track" x="126" y="20" width="420" height="14" rx="3"/>
<rect class="fill" x="126" y="20" width="23.5" height="14" rx="3"/>
<text class="v" x="556" y="31">6.2 MiB</text>
<text class="lab" x="118" y="57" text-anchor="end">640 × 480</text>
<rect class="track" x="126" y="46" width="420" height="14" rx="3"/>
<rect class="fill" x="126" y="46" width="24.6" height="14" rx="3"/>
<text class="v" x="556" y="57">6.5 MiB</text>
<text class="lab" x="118" y="83" text-anchor="end">1280 × 720</text>
<rect class="track" x="126" y="72" width="420" height="14" rx="3"/>
<rect class="fill" x="126" y="72" width="47.0" height="14" rx="3"/>
<text class="v" x="556" y="83">12.4 MiB</text>
<text class="lab" x="118" y="109" text-anchor="end">1920 × 1080</text>
<rect class="track" x="126" y="98" width="420" height="14" rx="3"/>
<rect class="fill" x="126" y="98" width="105.0" height="14" rx="3"/>
<text class="v" x="556" y="109">27.7 MiB</text>
<text class="lab" x="118" y="135" text-anchor="end">3840 × 2160</text>
<rect class="track" x="126" y="124" width="420" height="14" rx="3"/>
<rect class="fill" x="126" y="124" width="420.0" height="14" rx="3"/>
<text class="v" x="556" y="135">110.8 MiB</text>
</svg>
