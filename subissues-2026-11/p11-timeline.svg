<svg xmlns="http://www.w3.org/2000/svg" width="1128" height="288" viewBox="0 0 1128 288" role="img">
<title>rgbd: RgbdNormals after a rejected window size</title><style>
  .bg{fill:#ffffff} .call{fill:#eef2f7;stroke:#8a94a6} .calltxt{fill:#1f2328}
  .lbl{fill:#57606a} .ok{fill:#e8f5ec;stroke:#2f8a4f} .oktxt{fill:#1a5e33}
  .bad{fill:#fde8e8;stroke:#c62828} .badtxt{fill:#9b1c1c} .neu{fill:#f6f8fa;stroke:#c3cad3} .neutxt{fill:#3b434d}
  .arrow{stroke:#8a94a6;fill:none} .head{fill:#8a94a6} .grid{stroke:#d8dee4}
  text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .call{fill:#1c2430;stroke:#6e7781} .calltxt{fill:#e6edf3} .lbl{fill:#9198a1}
    .ok{fill:#12261b;stroke:#3fb950} .oktxt{fill:#7ee2a0} .bad{fill:#2d1215;stroke:#f85149} .badtxt{fill:#ffa198}
    .neu{fill:#161b22;stroke:#3d444d} .neutxt{fill:#c9d1d9} .arrow{stroke:#6e7781} .head{fill:#6e7781} .grid{stroke:#30363d}
  }</style>
<rect class="bg" width="1128" height="288" rx="8"/>
<rect class="call" x="190" y="20" width="210" height="58" rx="7"/>
<text x="295.0" y="40.0" class="calltxt mono" text-anchor="middle" dominant-baseline="middle">(*computer)(...)</text>
<text x="295.0" y="58.0" class="calltxt mono" text-anchor="middle" dominant-baseline="middle">window size 5</text>
<path class="arrow" d="M403 49.0 H420" stroke-width="1.6"/>
<path class="head" d="M420 44.0 L427 49.0 L420 54.0 Z"/>
<rect class="call" x="426" y="20" width="210" height="58" rx="7"/>
<text x="531.0" y="49.0" class="calltxt mono" text-anchor="middle" dominant-baseline="middle">setWindowSize(4)</text>
<path class="arrow" d="M639 49.0 H656" stroke-width="1.6"/>
<path class="head" d="M656 44.0 L663 49.0 L656 54.0 Z"/>
<rect class="call" x="662" y="20" width="210" height="58" rx="7"/>
<text x="767.0" y="49.0" class="calltxt mono" text-anchor="middle" dominant-baseline="middle">(*computer)(...)</text>
<path class="arrow" d="M875 49.0 H892" stroke-width="1.6"/>
<path class="head" d="M892 44.0 L899 49.0 L892 54.0 Z"/>
<rect class="call" x="898" y="20" width="210" height="58" rx="7"/>
<text x="1003.0" y="49.0" class="calltxt mono" text-anchor="middle" dominant-baseline="middle">~RgbdNormals()</text>
<line class="grid" x1="20" y1="93" x2="1108" y2="93" stroke-width="1"/>
<text x="20" y="135.0" class="lbl mono" text-anchor="start" dominant-baseline="middle">rgbd_normals_impl_</text>
<rect class="neu" x="190" y="100" width="210" height="70" rx="6" stroke-width="1.3"/>
<text x="295.0" y="126.0" class="neutxt" text-anchor="middle" dominant-baseline="middle">points to the</text>
<text x="295.0" y="144.0" class="neutxt" text-anchor="middle" dominant-baseline="middle">implementation A</text>
<rect class="neu" x="426" y="100" width="210" height="70" rx="6" stroke-width="1.3"/>
<text x="531.0" y="135.0" class="neutxt" text-anchor="middle" dominant-baseline="middle">still A</text>
<rect class="bad" x="662" y="100" width="210" height="70" rx="6" stroke-width="1.3"/>
<text x="767.0" y="117.0" class="badtxt" text-anchor="middle" dominant-baseline="middle">A is freed, the new one</text>
<text x="767.0" y="135.0" class="badtxt" text-anchor="middle" dominant-baseline="middle">is rejected: still</text>
<text x="767.0" y="153.0" class="badtxt" text-anchor="middle" dominant-baseline="middle">points to A</text>
<rect class="bad" x="898" y="100" width="210" height="70" rx="6" stroke-width="1.3"/>
<text x="1003.0" y="126.0" class="badtxt" text-anchor="middle" dominant-baseline="middle">deletes A again:</text>
<text x="1003.0" y="144.0" class="badtxt" text-anchor="middle" dominant-baseline="middle">double free</text>
<line class="grid" x1="20" y1="177" x2="1108" y2="177" stroke-width="1"/>
<text x="20" y="219.0" class="lbl" text-anchor="start" dominant-baseline="middle">result</text>
<rect class="ok" x="190" y="184" width="210" height="70" rx="6" stroke-width="1.3"/>
<text x="295.0" y="219.0" class="oktxt" text-anchor="middle" dominant-baseline="middle">normals</text>
<rect class="ok" x="662" y="184" width="210" height="70" rx="6" stroke-width="1.3"/>
<text x="767.0" y="210.0" class="oktxt" text-anchor="middle" dominant-baseline="middle">cv::Exception,</text>
<text x="767.0" y="228.0" class="oktxt" text-anchor="middle" dominant-baseline="middle">as expected</text>
<rect class="bad" x="898" y="184" width="210" height="70" rx="6" stroke-width="1.3"/>
<text x="1003.0" y="219.0" class="badtxt" text-anchor="middle" dominant-baseline="middle">segmentation fault</text>
</svg>