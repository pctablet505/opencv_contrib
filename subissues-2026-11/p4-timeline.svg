<svg xmlns="http://www.w3.org/2000/svg" width="726" height="354" viewBox="0 0 726 354" role="img">
<title>dnn: SAME convolution after an input size change</title><style>
  .bg{fill:#ffffff} .call{fill:#eef2f7;stroke:#8a94a6} .calltxt{fill:#1f2328}
  .lbl{fill:#57606a} .ok{fill:#e8f5ec;stroke:#2f8a4f} .oktxt{fill:#1a5e33}
  .bad{fill:#fde8e8;stroke:#c62828} .badtxt{fill:#9b1c1c} .neu{fill:#f6f8fa;stroke:#c3cad3} .neutxt{fill:#3b434d}
  .arrow{stroke:#8a94a6;fill:none} .head{fill:#8a94a6} .grid{stroke:#d8dee4}
  text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .call{fill:#1c2430;stroke:#6e7781} .calltxt{fill:#e6edf3} .lbl{fill:#9198a1}
    .ok{fill:#12261b;stroke:#3fb950} .oktxt{fill:#7ee2a0} .bad{fill:#2d1215;stroke:#f85149} .badtxt{fill:#ffa198}
    .neu{fill:#161b22;stroke:#3d444d} .neutxt{fill:#c9d1d9} .arrow{stroke:#6e7781} .head{fill:#6e7781} .grid{stroke:#30363d}
  }</style>
<rect class="bg" width="726" height="354" rx="8"/>
<rect class="call" x="220" y="20" width="230" height="58" rx="7"/>
<text x="335.0" y="40.0" class="calltxt mono" text-anchor="middle" dominant-baseline="middle">net.forward()</text>
<text x="335.0" y="58.0" class="calltxt mono" text-anchor="middle" dominant-baseline="middle">on 1x3x10x10</text>
<path class="arrow" d="M453 49.0 H470" stroke-width="1.6"/>
<path class="head" d="M470 44.0 L477 49.0 L470 54.0 Z"/>
<rect class="call" x="476" y="20" width="230" height="58" rx="7"/>
<text x="591.0" y="40.0" class="calltxt mono" text-anchor="middle" dominant-baseline="middle">net.forward()</text>
<text x="591.0" y="58.0" class="calltxt mono" text-anchor="middle" dominant-baseline="middle">on 1x3x9x9</text>
<line class="grid" x1="20" y1="93" x2="706" y2="93" stroke-width="1"/>
<text x="20" y="123.0" class="lbl" text-anchor="start" dominant-baseline="middle">SAME padding,</text>
<text x="20" y="141.0" class="lbl" text-anchor="start" dominant-baseline="middle">set by finalize()</text>
<rect class="neu" x="220" y="100" width="230" height="64" rx="6" stroke-width="1.3"/>
<text x="335.0" y="132.0" class="neutxt" text-anchor="middle" dominant-baseline="middle">computed for 10x10</text>
<rect class="neu" x="476" y="100" width="230" height="64" rx="6" stroke-width="1.3"/>
<text x="591.0" y="132.0" class="neutxt" text-anchor="middle" dominant-baseline="middle">computed for 9x9</text>
<line class="grid" x1="20" y1="171" x2="706" y2="171" stroke-width="1"/>
<text x="20" y="201.0" class="lbl" text-anchor="start" dominant-baseline="middle">packed convolution</text>
<text x="20" y="219.0" class="lbl" text-anchor="start" dominant-baseline="middle">(fastConvImpl)</text>
<rect class="ok" x="220" y="178" width="230" height="64" rx="6" stroke-width="1.3"/>
<text x="335.0" y="201.0" class="oktxt" text-anchor="middle" dominant-baseline="middle">packed with</text>
<text x="335.0" y="219.0" class="oktxt" text-anchor="middle" dominant-baseline="middle">the 10x10 padding</text>
<rect class="bad" x="476" y="178" width="230" height="64" rx="6" stroke-width="1.3"/>
<text x="591.0" y="201.0" class="badtxt" text-anchor="middle" dominant-baseline="middle">kept: still has</text>
<text x="591.0" y="219.0" class="badtxt" text-anchor="middle" dominant-baseline="middle">the 10x10 padding</text>
<line class="grid" x1="20" y1="249" x2="706" y2="249" stroke-width="1"/>
<text x="20" y="288.0" class="lbl" text-anchor="start" dominant-baseline="middle">result</text>
<rect class="ok" x="220" y="256" width="230" height="64" rx="6" stroke-width="1.3"/>
<text x="335.0" y="288.0" class="oktxt" text-anchor="middle" dominant-baseline="middle">correct</text>
<rect class="bad" x="476" y="256" width="230" height="64" rx="6" stroke-width="1.3"/>
<text x="591.0" y="279.0" class="badtxt" text-anchor="middle" dominant-baseline="middle">all 100 values wrong,</text>
<text x="591.0" y="297.0" class="badtxt" text-anchor="middle" dominant-baseline="middle">by up to 5.3</text>
</svg>